name: ATANOR TEP — D11 Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d11-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run D11
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python runtime/d11_runner.py

      - name: Upload D11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: atanor-d11-evidence
          path: evidence/d11/**
          if-no-files-found: error